# ====================================================================
# Blueprint do Render — Nossa Sessão 🍿
#
# No Render: New > Blueprint > aponta pro repositório. Ele lê este
# arquivo e cria os dois serviços. Os valores marcados sync:false são
# segredos: o Render pergunta na hora de criar.
#
# Depois do primeiro deploy, volte e preencha:
#   - na API:  PUBLIC_BASE_URL e FRONTEND_URL com as URLs reais
#   - no web:  VITE_API_URL com a URL da API
# (só dá pra saber as URLs depois que os serviços existem)
# ====================================================================

services:
  # ------------------------------------------------------------------
  # Backend: busca de música, stream, IPTV e export de playlists
  # ------------------------------------------------------------------
  - type: web
    name: nossa-sessao-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    healthCheckPath: /api/health
    # O binário estático do yt-dlp já vem com Python embutido, então
    # não precisa de runtime Python no serviço. Baixar no build garante
    # a versão mais nova a cada deploy — e isso importa, porque o
    # YouTube muda as defesas com frequência.
    buildCommand: |
      npm install
      mkdir -p bin
      curl -sSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o bin/yt-dlp
      chmod +x bin/yt-dlp
      ./bin/yt-dlp --version
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: YTDLP_PATH
        value: ./bin/yt-dlp
      - key: IPTV_USER_AGENT
        value: VLC/3.0.20 LibVLC/3.0.20
      # Gerado pelo Render e copiado pro VITE_APP_TOKEN do frontend.
      - key: APP_TOKEN
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DEEZER_ACCESS_TOKEN
        sync: false

  # ------------------------------------------------------------------
  # Frontend (PWA). Se preferir publicar na Vercel, apague este bloco.
  # ------------------------------------------------------------------
  - type: web
    name: nossa-sessao-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      # SPA: qualquer rota cai no index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_TMDB_API_KEY
        sync: false
      - key: VITE_RELATIONSHIP_START_DATE
        value: 2024-03-24
      - key: VITE_API_URL
        sync: false
      # Tem que ser igual ao APP_TOKEN da API.
      - key: VITE_APP_TOKEN
        sync: false
