<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D2B" />
      <stop offset="100%" stop-color="#08090D" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#purpleGrad)" stroke-width="8" opacity="0.6" />

  <!-- Glow element -->
  <circle cx="256" cy="240" r="140" fill="#8B5CF6" opacity="0.25" filter="url(#glow)" />

  <!-- Popcorn emoji text icon -->
  <text x="256" y="320" font-size="240" text-anchor="middle" dominant-baseline="central">🍿</text>
</svg>
